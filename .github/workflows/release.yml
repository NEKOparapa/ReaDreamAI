name: Build and Deploy Pre-release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # =======================================================
  # Job 1: 构建 Windows 版本 (必须用 Windows Runner)
  # =======================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows executable
        run: flutter build windows --release

      - name: Package Windows release assets
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "ReaDreamAI-beta-windows.zip" -Force

      # 上传产物供发布 Job 使用
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ReaDreamAI-beta-windows.zip

  # =======================================================
  # Job 2: 构建 Android 版本 (使用 Ubuntu Runner 更稳更快)
  # =======================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest # 改用 Ubuntu
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          # 开启 Gradle 缓存，减少重复下载，降低 403 风险
          cache: 'gradle' 

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Android Keystore and Properties
        # Ubuntu 使用 bash，且需要 base64 解码工具
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ReaDreamAI-beta-android.apk

      # 上传产物供发布 Job 使用
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/ReaDreamAI-beta-android.apk

  # =======================================================
  # Job 3: 发布 Release (等待前两个任务完成)
  # =======================================================
  release:
    name: Create Release
    needs: [build-windows, build-android] # 依赖上面两个任务
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release

      - name: Delete old pre-releases
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: Beta
          delete_release: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Beta
          name: ReaDreamAI 开发测试版本 (由最新源码自动打包)
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            ReaDreamAI-beta-windows.zip
            ReaDreamAI-beta-android.apk
          token: ${{ secrets.GITHUB_TOKEN }}