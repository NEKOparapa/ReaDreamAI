name: Build and Deploy Pre-release

on:
  workflow_dispatch: # 允许你从 Actions 选项卡手动运行此工作流
  push:
    # 只有当推送到 main 分支时才触发
    branches:
      - main

# 授予写入仓库内容的权限，以便创建和删除 Release
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Pre-release
    runs-on: windows-latest

    steps:
      # 步骤1：检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：设置 Java 和 Flutter 环境
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 步骤3：安装项目依赖
      - name: Install dependencies
        run: flutter pub get

      # =======================================================
      # 步骤4：构建 Windows release 版本的应用
      # =======================================================
      - name: Build Windows executable
        run: flutter build windows --release

      - name: Package Windows release assets
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "ReaDreamAI-beta-windows.zip" -Force

      # =======================================================
      # 步骤5：构建 Android APK
      # =======================================================
      - name: Setup Android Keystore and Properties
        shell: pwsh
        run: |
          # 解码 Base64 密钥库并写入到 app 目录
          $keystoreBase64 = "${{ secrets.KEYSTORE_BASE64 }}"
          $keystorePath = "android/app/upload-keystore.jks"
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($keystoreBase64))
          echo "Keystore decoded and saved to $keystorePath"

          # 创建 key.properties 文件
          $keyPropertiesPath = "android/key.properties"
          # 关键修复：storeFile 的路径是相对于 android/app/build.gradle 的，所以直接写文件名即可
          "storeFile=upload-keystore.jks" | Out-File -FilePath $keyPropertiesPath -Encoding UTF8
          "keyAlias=${{ secrets.KEY_ALIAS }}" | Out-File -FilePath $keyPropertiesPath -Encoding UTF8 -Append
          "keyPassword=${{ secrets.KEY_PASSWORD }}" | Out-File -FilePath $keyPropertiesPath -Encoding UTF8 -Append
          "storePassword=${{ secrets.STORE_PASSWORD }}" | Out-File -FilePath $keyPropertiesPath -Encoding UTF8 -Append
          echo "key.properties file created successfully."

      # 可选：验证密钥库和配置文件是否正确创建
      - name: Verify Keystore and Properties
        shell: pwsh
        run: |
          echo "=== Checking keystore file ==="
          if (Test-Path "android/app/upload-keystore.jks") {
            echo "✓ Keystore found at android/app/upload-keystore.jks"
          } else {
            echo "✗ Keystore NOT found!"
            exit 1
          }
          
          echo "`n=== key.properties content ==="
          Get-Content "android/key.properties"
      
          
      - name: Build Android APK (ARM64)
        run: flutter build apk --release --target-platform android-arm64
        
      - name: Rename APK for release
        shell: pwsh
        run: |
          # 直接使用实际生成的文件名
          $sourceApkPath = "build\app\outputs\flutter-apk\app-release.apk"
          $destinationPath = "build\app\outputs\flutter-apk\ReaDreamAI-beta-android.apk"
          
          if (Test-Path $sourceApkPath) {
            Copy-Item -Path $sourceApkPath -Destination $destinationPath
            echo "✓ APK copied to $destinationPath"
          } else {
            echo "✗ APK not found!"
            Get-ChildItem -Path "build\app\outputs\flutter-apk" | Format-Table Name, Length
            exit 1
          }



      # 步骤6：删除旧的预览版，以便发布同名新版
      - name: Delete old pre-releases
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: Beta
          delete_release: true # 删除标签对应的 Release
          github_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # 如果没有旧版本，允许继续执行
          
      # 步骤7：创建 GitHub Pre-release 并上传所有产物
      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Beta
          name: ReaDreamAI 开发测试版本 (由最新源码自动打包)
          draft: false
          prerelease: true
          generate_release_notes: true
          # 上传打包好的 Windows zip 和重命名后的 Android APK
          files: |
            ReaDreamAI-beta-windows.zip
            build/app/outputs/flutter-apk/ReaDreamAI-beta-android.apk
          token: ${{ secrets.GITHUB_TOKEN }}