name: Build and Deploy Pre-release

on:
  workflow_dispatch: # 允许你从 Actions 选项卡手动运行此工作流
  push:
    # 只有当推送到 main 分支时才触发
    branches:
      - main

# 授予写入仓库内容的权限，以便创建和删除 Release
permissions:
  contents: write

jobs:
  build-and-release:
    # 任务的名称
    name: Build and Release Pre-release
    # 指定运行此任务的虚拟机环境 (windows-latest 可以同时构建 Windows 和 Android)
    runs-on: windows-latest

    # 任务的执行步骤
    steps:
      # 步骤1：检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：设置 Flutter 环境
      # 建议在此处也设置 Java，以确保 keytool 等工具可用
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 步骤3：安装项目依赖
      - name: Install dependencies
        run: flutter pub get

      # =======================================================
      # 步骤4：构建 Windows release 版本的应用
      # =======================================================
      - name: Build Windows executable
        run: flutter build windows --release

      # 步骤5：将 Windows 构建产物打包成 ZIP
      - name: Package Windows release assets
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "ReaDreamAI-beta-windows.zip" -Force

      # =======================================================
      # 步骤6：构建 Android APK
      # =======================================================
      - name: Setup Android Keystore and Properties
        shell: pwsh
        run: |
          # 解码 Base64 密钥库并写入文件
          $keystoreBase64 = "${{ secrets.KEYSTORE_BASE64 }}"
          $keystorePath = "android/app/upload-keystore.jks"
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($keystoreBase64))
          echo "Keystore decoded and saved to $keystorePath"

          # 创建 key.properties 文件
          $keyPropertiesPath = "android/key.properties"
          "storeFile=app/upload-keystore.jks" | Out-File -FilePath $keyPropertiesPath -Encoding UTF8
          "keyAlias=${{ secrets.KEY_ALIAS }}" | Out-File -FilePath $keyPropertiesPath -Encoding UTF8 -Append
          "keyPassword=${{ secrets.KEY_PASSWORD }}" | Out-File -FilePath $keyPropertiesPath -Encoding UTF8 -Append
          "storePassword=${{ secrets.STORE_PASSWORD }}" | Out-File -FilePath $keyPropertiesPath -Encoding UTF8 -Append
          echo "key.properties file created successfully."
      
      - name: Build Android APK
        run: flutter build apk --release
        
      - name: Rename APK for release
        shell: pwsh
        run: |
          # 将默认的 app-release.apk 重命名为更具描述性的名字
          Rename-Item -Path "build\app\outputs\flutter-apk\app-release.apk" -NewName "ReaDreamAI-beta-android.apk"


      # 步骤7：删除旧的预览版
      - name: Delete old pre-releases
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: Beta
          delete_release: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # 如果没有旧版本，允许继续执行
          
      # 步骤8：创建 GitHub Pre-release 并上传所有产物
      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Beta
          name: ReaDreamAI 开发测试版本，由最新源码自动打包 
          draft: false
          prerelease: true
          generate_release_notes: true 
          # 使用多行字符串上传多个文件
          files: |
            ReaDreamAI-beta-windows.zip
            ReaDreamAI-beta-android.apk
          token: ${{ secrets.GITHUB_TOKEN }}