name: Build and Deploy Pre-release

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab
  push:
    branches:
      - main # Change to 'master' if your main branch is named differently

permissions:
  contents: write # Grants permission to write to repository contents for creating releases

jobs:
  build-and-release:
    name: Build and Release Pre-release
    runs-on: ubuntu-latest # Use Ubuntu for better Android build compatibility

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Enable caching to speed up builds

      # Step 3: Set up JDK for Android
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Compatible with Android Gradle plugin

      # Step 4: Install project dependencies
      - name: Install dependencies
        run: flutter pub get

      # Step 5: Build Android APK
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Create key.properties file for signing
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties
          # Build the APK
          flutter build apk --release

      # Step 6: Build Windows executable
      - name: Build Windows executable
        run: flutter build windows --release
        if: runner.os == 'Windows' # Conditional for Windows build (optional if keeping Windows)

      # Step 7: Package release assets
      - name: Package release assets
        run: |
          # Package APK
          cp build/app/outputs/flutter-apk/app-release.apk ReaDreamAI-beta-android.apk
          # Package Windows ZIP (optional if keeping Windows)
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path build\\windows\\x64\\runner\\Release\\* -DestinationPath ReaDreamAI-beta-windows.zip -Force"
          fi

      # Step 8: Delete old pre-releases
      - name: Delete old pre-releases
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: Beta
          delete_release: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Step 9: Create GitHub Pre-release and upload assets
      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Beta
          name: ReaDreamAI Beta (Android & Windows)
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            ReaDreamAI-beta-android.apk
            ReaDreamAI-beta-windows.zip
          token: ${{ secrets.GITHUB_TOKEN }}